name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Verify release metadata
        run: |
          node --check main.js
          node -e "const m=require('./manifest.json'); const p=require('./package.json'); if (m.version !== p.version) throw new Error('manifest/package version mismatch'); if (m.version !== process.env.GITHUB_REF_NAME) throw new Error('tag must match manifest version'); if (/obsidian/i.test(m.description)) throw new Error('manifest description must not include Obsidian');"

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" \
            --notes "Fixes Obsidian Community Directory review findings for the initial release."
